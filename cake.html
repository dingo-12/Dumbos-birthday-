<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#32131d"><title>A Cake for Dumbo ♡</title><link rel="stylesheet" href="style.css"><style>
.cake-page{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:34px 18px}.cake-card{width:min(620px,100%);background:#f3ecdf;color:#39252c;padding:38px 24px;border:1px solid #d4bd9c;border-radius:7px;box-shadow:0 18px 60px #10070c66;text-align:center}.cake-card h1{color:#4b1d2a;font-size:clamp(38px,8vw,62px)}.cake-card p{color:#775d5c;line-height:1.6}.big-cake{position:relative;width:260px;height:230px;margin:25px auto 20px}.big-cake .layer{position:absolute;left:20px;width:220px;border-radius:18px 18px 24px 24px;box-shadow:inset 0 -9px #00000012}.layer-bottom{height:72px;bottom:8px;background:#8c3f50}.layer-top{height:74px;bottom:72px;background:#d9a7a0}.icing{position:absolute;left:20px;bottom:128px;width:220px;height:30px;border-radius:50%;background:#fff0d8}.icing:after{content:"";position:absolute;left:12px;right:12px;top:13px;height:24px;background:radial-gradient(circle at 12px 0,#fff0d8 0 11px,transparent 12px) 0 0/34px 24px repeat-x}.candle-row{position:absolute;z-index:3;left:78px;bottom:153px;display:flex;gap:29px}.candle{height:47px;width:9px;border-radius:3px;background:repeating-linear-gradient(45deg,#fff4d8 0 6px,#bd6d76 6px 11px);position:relative}.flame{position:absolute;left:-3px;top:-20px;width:15px;height:21px;border-radius:55% 45% 55% 45%;background:#f4b84f;box-shadow:0 0 18px #f4b84f;animation:flame 0.65s infinite alternate}@keyframes flame{to{transform:scale(.83) rotate(6deg);opacity:.82}}.cake-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.cake-actions a{color:#77502e}.cake-heart{font-size:24px;color:#9b5264;margin-top:16px}
</style></head><body><div class="sparkle-layer" aria-hidden="true"></div><div class="topline"><span>FOR DUMBO ♡</span><a class="music-toggle" href="index.html">← Back to your surprises</a></div><main class="cake-page"><section class="cake-card"><p class="eyebrow">MAKE A WISH</p><h1>Happy Birthday,<br><em>Dumbo.</em></h1><div class="big-cake" aria-label="A birthday cake with lit candles"><div class="candle-row"><i class="candle"><b class="flame"></b></i><i class="candle"><b class="flame"></b></i><i class="candle"><b class="flame"></b></i></div><div class="icing"></div><div class="layer layer-top"></div><div class="layer layer-bottom"></div></div><p>Make a wish, dumbo. May this year be kinder, brighter, and full of things that make you ridiculously happy. ♡</p><p class="cake-heart">✧ ✦ ✧</p><div class="cake-actions"><a class="button" href="index.html">Back to the surprises</a></div></section></main></body></html>
